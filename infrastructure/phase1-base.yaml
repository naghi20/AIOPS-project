AWSTemplateFormatVersion: '2010-09-09'
Description: |
  Phase 1: Core Foundation Base - Runbook bucket, alert queue with dead-letter queue, secrets for ServiceNow and webhook token, and a monthly cost budget alert.

Parameters:
  ProjectName:
    Type: String
    Default: aiops
    AllowedPattern: '[a-z0-9-]{3,20}'
    Description: Lowercase prefix for resource names.
  BudgetEmail:
    Type: String
    Default: alert@example.com
    Description: Email that receives the budget alert.
  BudgetAmount:
    Type: Number
    Default: 50
    Description: Monthly account cost threshold in USD.

Resources:
  RunbookBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ProjectName}-runbooks-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  AlertDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-alerts-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AlertQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub ${ProjectName}-alerts
      VisibilityTimeout: 120
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AlertDLQ.Arn
        maxReceiveCount: 5

  ServiceNowSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/servicenow
      Description: ServiceNow integration credentials. Replace the CHANGE_ME values
        after deploy.
      SecretString: '{"instance_url":"https://CHANGE_ME.service-now.com","user":"svc_aiops_agent","password":"CHANGE_ME"}'

  WebhookTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${ProjectName}/webhook-token
      Description: Shared secret Grafana sends in the x-aiops-token header.
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub ${ProjectName}-monthly-cost
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetAmount
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail