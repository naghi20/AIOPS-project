AWSTemplateFormatVersion: "2010-09-09"
Description: Phase 3 Vector Storage - OpenSearch Serverless collection, policies and Knowledge Base role.

Parameters:
  ProjectName:
    Type: String
    Default: aiops
  DeployRoleArn:
    Type: String

Resources:
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-enc-policy"
      Type: encryption
      Policy: !Sub >
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"]}],"AWSOwnedKey":true}

  OpenSearchNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${ProjectName}-net-policy"
      Type: network
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"]},{"ResourceType":"dashboard","Resource":["collection/${ProjectName}-vectors"]}],"AllowFromPublic":true}]

  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${ProjectName}-data-policy"
      Type: data
      Policy: !Sub >
        [{"Rules":[{"ResourceType":"collection","Resource":["collection/${ProjectName}-vectors"],"Permission":["aoss:CreateCollectionItems","aoss:DeleteCollectionItems","aoss:UpdateCollectionItems","aoss:DescribeCollectionItems"]},{"ResourceType":"index","Resource":["index/${ProjectName}-vectors/*"],"Permission":["aoss:CreateIndex","aoss:DeleteIndex","aoss:UpdateIndex","aoss:DescribeIndex","aoss:ReadDocument","aoss:WriteDocument"]}],"Principal":["${BedrockKnowledgeBaseRole.Arn}","${DeployRoleArn}"]}]

  VectorCollection:
    Type: AWS::OpenSearchServerless::Collection
    DependsOn: [OpenSearchEncryptionPolicy, OpenSearchNetworkPolicy]
    Properties:
      Name: !Sub "${ProjectName}-vectors"
      Type: VECTORSEARCH

  BedrockKnowledgeBaseRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-bedrock-kb-role-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockKbS3AndOpenSearchAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["bedrock:InvokeModel"]
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0"
              - Effect: Allow
                Action: ["s3:GetObject", "s3:ListBucket"]
                Resource:
                  - !Sub "arn:aws:s3:::${ProjectName}-runbooks-${AWS::AccountId}-${AWS::Region}"
                  - !Sub "arn:aws:s3:::${ProjectName}-runbooks-${AWS::AccountId}-${AWS::Region}/*"
              - Effect: Allow
                Action: ["aoss:APIAccessAll"]
                Resource: !Sub "arn:aws:aoss:${AWS::Region}:${AWS::AccountId}:collection/${VectorCollection.Id}"

Outputs:
  CollectionArn:
    Value: !GetAtt VectorCollection.Arn
    Export:
      Name: !Sub "${ProjectName}-collection-arn"
  KbRoleArn:
    Value: !GetAtt BedrockKnowledgeBaseRole.Arn
    Export:
      Name: !Sub "${ProjectName}-kb-role-arn"
