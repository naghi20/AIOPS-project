AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Phase 5: Bedrock Agent Orchestrator - Configures the central AI Agent,
  its prompt loop instructions, action group tools, and knowledge base associations.

Parameters:
  ProjectName:
    Type: String
    Default: aiops
    AllowedPattern: "[a-z0-9-]{3,20}"
    Description: Lowercase prefix for resource names matching previous phases.
  KnowledgeBaseId:
    Type: String
    Description: The ID of the Bedrock Knowledge Base generated in Phase 3b.
  ActionGroupLambdaArn:
    Type: String
    Description: The ARN of the Action-Group Tool Lambda function generated in Phase 4.
  FoundationModelId:
    Type: String
    Default: us.anthropic.claude-sonnet-4-5-20250929-v1:0
    Description: Model or inference profile ID copied from the Bedrock console.

Resources:
  BedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "AmazonBedrockExecutionRoleForAgents_${ProjectName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: BedrockAgentCentralExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:GetInferenceProfile
                Resource:
                  - "arn:aws:bedrock:*::foundation-model/anthropic.*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - bedrock:Retrieve
                Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${KnowledgeBaseId}"
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref ActionGroupLambdaArn

  AIOpsBedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Sub "${ProjectName}-orchestrator"
      Description: Core automated incident triage and remediation agent loop.
      FoundationModel: !Ref FoundationModelId
      AgentResourceRoleArn: !GetAtt BedrockAgentRole.Arn
      IdleSessionTTLInSeconds: 900
      AutoPrepare: true
      Instruction: >
        You are the automated AIOps Incident Orchestrator. When an alert arrives, your goal is to triage and resolve it using approved procedures.
        Follow this strict step execution sequence:
        1. Parse the alert payload.
        2. Query your Knowledge Base to find standard operating runbooks matching the alert fingerprint.
        3. Invoke the QueryTelemetry tool to verify if the metric anomaly is still actively violating thresholds in Grafana.
        4. Based on the runbook instructions, identify the remediation script name (must start with the prefix 'AIOps-').
        5. Invoke the ExecuteRemediation tool passing the target identity parameters.
        6. Log execution outcome states back into your final interaction summary text.
        Always verify runbook parameters before pushing execution triggers.
      ActionGroups:
        - ActionGroupName: OperationalTools
          Description: Interfaces allowing the agent to check Grafana and execute SSM remediations.
          ActionGroupExecutor:
            Lambda: !Ref ActionGroupLambdaArn
          FunctionSchema:
            Functions:
              - Name: QueryTelemetry
                Description: Queries live telemetry trends from Prometheus/Grafana to verify if an alert is still active.
                Parameters:
                  query:
                    Type: string
                    Description: PromQL query string targeting the anomalous metric.
                    Required: true
              - Name: ExecuteRemediation
                Description: Evaluates safety boundaries and executes a targeted AWS SSM Automation Runbook.
                Parameters:
                  runbook_name:
                    Type: string
                    Description: The target automation script to invoke (Must start with AIOps-).
                    Required: true
                  target_id:
                    Type: string
                    Description: Target workload descriptor identifier (such as an EC2 InstanceId).
                    Required: true
      KnowledgeBases:
        - KnowledgeBaseId: !Ref KnowledgeBaseId
          Description: Main vector memory database containing standard operating procedures and diagnostic telemetry scripts.
          KnowledgeBaseState: ENABLED

Outputs:
  AgentId:
    Description: Use this ID inside your alert routing architecture to forward ingestion streams.
    Value: !Ref AIOpsBedrockAgent
  AgentArn:
    Description: The exact resource identification path of your provisioned AIOps Brain.
    Value: !GetAtt AIOpsBedrockAgent.AgentArn
