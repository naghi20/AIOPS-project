name: AIOps Infrastructure CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"

jobs:
  deploy-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Deploy Phase 1 - Base Infrastructure
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: "aiops-phase1-base"
          template: "infrastructure/phase1-base.yaml"
          no-fail-on-empty-changeset: "1"
          parameter-overrides: >-
            BudgetEmail=${{ secrets.BUDGET_EMAIL }}
            
      - name: Package and upload Lambda code
        run: |
          BUCKET="aiops-runbooks-140023407747-us-east-1"
          (cd src/ingest_lambda && zip -r ../../ingest_lambda.zip . -x "*.pyc" "__pycache__/*")
          (cd src/tool_lambda && zip -r ../../tool_lambda.zip . -x "*.pyc" "__pycache__/*")
          unzip -l ingest_lambda.zip
          aws s3 cp ingest_lambda.zip "s3://${BUCKET}/src/ingest_lambda.zip"
          aws s3 cp tool_lambda.zip "s3://${BUCKET}/src/tool_lambda.zip"   
          
      - name: Deploy Phase 2 - Ingress & Ingestion
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: "aiops-phase2-ingress"
          template: "infrastructure/phase2-ingress.yaml"
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM

      - name: Deploy Phase 3 - OpenSearch collection
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: aiops-phase3-vector-store
          template: infrastructure/phase3-vector-store.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
          parameter-overrides: >-
            DeployRoleArn=${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Create vector index
        run: |
          pip install awscurl
          ENDPOINT=$(aws opensearchserverless batch-get-collection --names aiops-vectors --query 'collectionDetails[0].collectionEndpoint' --output text)
          sleep 60
          awscurl --service aoss --region us-east-1 -X PUT "$ENDPOINT/aiops-index" -H "Content-Type: application/json" -d '{"settings":{"index.knn":true},"mappings":{"properties":{"vector":{"type":"knn_vector","dimension":1024,"method":{"name":"hnsw","engine":"faiss","space_type":"l2"}},"text":{"type":"text"},"metadata":{"type":"text"}}}}' || true
          awscurl --service aoss --region us-east-1 -X GET "$ENDPOINT/aiops-index" | tee index.json
          grep -q knn_vector index.json

      - name: Deploy Phase 3b - Knowledge Base
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: aiops-phase3b-knowledge-base
          template: infrastructure/phase3b-knowledge-base.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM

      - name: Deploy Phase 4 - Tool Lambda
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: aiops-phase4-tools
          template: infrastructure/phase4-tools.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM

      - name: Read stack outputs
        id: stackvalues
        run: |
          KB_ID=$(aws cloudformation describe-stacks --stack-name aiops-phase3b-knowledge-base --query "Stacks[0].Outputs[?OutputKey=='KnowledgeBaseId'].OutputValue" --output text)
          TOOL_ARN=$(aws cloudformation describe-stacks --stack-name aiops-phase4-tools --query "Stacks[0].Outputs[?OutputKey=='ToolLambdaArn'].OutputValue" --output text)
          echo "kb_id=$KB_ID" >> "$GITHUB_OUTPUT"
          echo "tool_arn=$TOOL_ARN" >> "$GITHUB_OUTPUT"

      - name: Deploy Phase 5 - Amazon Bedrock Orchestrator Agent
        uses: aws-actions/aws-cloudformation-github-deploy@v1
        with:
          name: aiops-phase5-agent
          template: infrastructure/phase5-agent.yaml
          no-fail-on-empty-changeset: "1"
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
          parameter-overrides: >-
            KnowledgeBaseId=${{ steps.stackvalues.outputs.kb_id }},ActionGroupLambdaArn=${{ steps.stackvalues.outputs.tool_arn }}
