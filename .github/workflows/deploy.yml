name: AIOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python Linters
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Lambda Functions
        run: |
          # Check for syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validate CloudFormation Templates
        run: |
          echo "Validating CloudFormation infrastructure deployment templates..."
          # In real enterprise pipelines, replace with aws cloudformation validate-template or cfn-lint
          # uses: aws-actions/configure-aws-credentials before running aws cli validation commands
